quick_quote_post_location_threshold:
  type: integer
  default: 3
  description:
    en: "Number of recent posts that do not receive an automatic quote."
quick_quote_remove_links:
  type: bool
  default: true
  description:
    en: "Remove links and linked images from automatic quotes."
quick_quote_remove_prior_quotes:
  type: bool
  default: true
  description:
    en: "Remove nested quotes from automatic quotes."
quick_quote_remove_contiguous_new_lines:
  type: bool
  default: true
  description:
    en: "Combine paragraphs in automatic quotes into a continuous block."
quick_quote_character_limit:
  type: integer
  default: 400
  description:
    en: "Maximum automatic quote length; longer quotes keep their final characters."
